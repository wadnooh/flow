# ====================================================================
# Nginx Configuration for: rtcco.org
# نظام متابعة الكهربائية والفرق الميدانية
# ====================================================================

# 1. تحويل جميع اتصالات HTTP إلى HTTPS مشفر
server {
    listen 80;
    listen [::]:80;
    server_name rtcco.org www.rtcco.org api.rtcco.org;

    # مسار التحقق لشهادات Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. خادم HTTPS الرئيسي للنظام
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rtcco.org www.rtcco.org;

    # شهادات الأمان SSL (يتم توليدها تلقائياً عبر Certbot)
    ssl_certificate /etc/letsencrypt/live/rtcco.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtcco.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # حماية وأمان إضافي
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # مسار ملفات لوحة التحكم ومحاكي الجوال (React Frontend Dist)
    root /var/www/electrical_field/frontend/dist;
    index index.html;

    # دعم توجيه Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلبات الـ API إلى خادم FastAPI (Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        # ترويسات العميل والـ IP الحقيقي
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # دعم WebSocket لتتبع الإحداثيات المباشر
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # أوقات انتظار الاستجابة
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # توجيه واجهة توثيق Swagger التفاعلية
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # تسريع التخزين المؤقت للملفات الثابتة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
